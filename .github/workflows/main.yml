name: CI-Pipeline

on:
    push:
        branches:
            - pipeline


jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v2
            - name: Set up Dotnet
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: '10.0.x'
            - name: Build Code
              run: dotnet build 
            - name: Run Unit Tests
              run: dotnet test ./tests/TaskManagement.UnitTests
            - name: Run Integration Tests
              run: dotnet test ./tests/TaskManagement.IntegrationTests
    build:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout Code
              uses: actions/checkout@v2
            - name: Build Docker Image
              run: docker build -t ammargamal001/taskmanagement:${{github.sha}} .
            - name: Docker Login 
              run: |
                echo ${{secrets.DOCKER_TOKEN}} | docker login -u ${{secrets.DOCKER_USERNAME}} --password-stdin
            - name: Push Docker Image
              run: docker push ammargamal001/taskmaanagement:${{github.sha}}

