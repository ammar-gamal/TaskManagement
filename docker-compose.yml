services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: almentor-taskmanagement-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Server=db,1433;User Id=sa;Password=Dev@123456789;DataBase=TaskManagementDb;TrustServerCertificate=True"
      Serilog__WriteTo__1__Args__serverUrl: http://logging:80 #change the port according to the internal port in the logging service
    ports:
      - "5130:8080"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      logging:
        condition: service_healthy
        restart: true
    networks:
      - almentor-network

  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: almentor-taskmanagement-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev@123456789"
    ports:
      - target: 1433
        published: 1433
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Dev@123456789" -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - almentor-network
    volumes:
      - type: volume
        source: sql-vol
        target: /var/opt/mssql

  logging:
    image: datalust/seq:latest
    container_name: almentor-taskmanagement-logging
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    ports:
      - "5000:80"
    healthcheck:
      test: [ "CMD-SHELL", "seqcli node health -s http://localhost || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - almentor-network
    volumes:
      - type: volume
        source: seq-vol
        target: /data

networks:
  almentor-network:
    driver: bridge

volumes:
  sql-vol:
  seq-vol:
